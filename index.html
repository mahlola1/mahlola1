<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>محلولة | ما عرفت تسويها؟ خلّها محلولة</title>

    <meta name="description"
          content="محلولة تساعدك على فهم الخدمات والمواقع والأدوات خطوة بخطوة، مع شرح بالصور والفيديو وذكاء اصطناعي يساعدك.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #171717;
        }

        header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .help-button {
            background: #111827;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
        }

        .hero {
            max-width: 900px;
            margin: 70px auto 40px;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            background: white;
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 6px;
            max-width: 650px;
            margin: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 15px;
            font-size: 16px;
            direction: rtl;
        }

        .search-box button {
            border: none;
            background: #111827;
            color: white;
            padding: 0 25px;
            border-radius: 10px;
            cursor: pointer;
        }

        .section {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .card p {
            color: #666;
            font-size: 14px;
        }

        .ai {
            background: #111827;
            color: white;
            border-radius: 20px;
            padding: 35px;
            text-align: center;
        }

        .ai p {
            color: #d1d5db;
            margin: 12px 0 20px;
        }

        .ai button {
            border: none;
            background: white;
            color: #111827;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        footer {
            margin-top: 70px;
            padding: 30px;
            text-align: center;
            background: white;
            border-top: 1px solid #e5e7eb;
            color: #777;
        }

        @media (max-width: 600px) {
            .hero {
                margin-top: 40px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .search-box {
                flex-direction: column;
                gap: 6px;
            }

            .search-box button {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="logo">محلولة</div>

        <a href="#" class="help-button">
            🆘 ساعدني
        </a>
    </div>
</header>
